<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Киберкубок — статистика команд</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__left">
      <span class="logo">◈</span>
      <h1>Киберкубок партнёров Яндекса</h1>
      <span class="subtitle">CS2 · статистика игроков через FACEIT</span>
    </div>
    <div class="topbar__right">
      <input type="search" id="search" placeholder="Поиск команды…" />
      <button id="refreshAll" title="Сбросить кэш и загрузить заново">Обновить</button>
    </div>
  </header>

  <main>
    <div id="status" class="status">Загрузка списка команд…</div>
    <div id="teams" class="teams"></div>
  </main>

  <!-- Модальное окно команды -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal__overlay" id="modal-overlay"></div>
    <div class="modal__window">
      <div class="modal__header">
        <h2 class="modal__title" id="modal-title">Team</h2>
        <button class="modal__close" id="modal-close" aria-label="Закрыть">✕</button>
      </div>
      <div class="modal__body" id="modal-body"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
